<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Berzerk (JS machine) — T2.9 shell</title>
  <style>
    body { background: #111; color: #ccc; font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    #screen { image-rendering: pixelated; width: 768px; height: 672px; background: #000; display: block; border: 1px solid #333; }
    #status { margin: 8px 0; min-height: 1.4em; }
    kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 4px; }
    .row { margin: 8px 0; }
    #rec-btn { padding: 2px 10px; cursor: pointer; }
    #rec-btn.recording { background: #c00; color: #fff; border-color: #f44; }
  </style>
</head>
<body>
  <h1>Berzerk — JS machine (Phase 2 boot shell)</h1>
  <div class="row">
    <label>Load ROM set (select the <code>rom/berzerk/</code> files):
      <input id="roms" type="file" multiple />
    </label>
  </div>
  <div id="status">Select the Berzerk ROM files to boot. (rom0 + rom1-5; voice ROMs optional/ignored.)</div>
  <canvas id="screen" width="256" height="224"></canvas>
  <div class="row">
    Controls: <kbd>&larr;&uarr;&darr;&rarr;</kbd> move &nbsp; <kbd>Space</kbd>/<kbd>Z</kbd> fire &nbsp;
    <kbd>1</kbd> 1P start &nbsp; <kbd>2</kbd> 2P start &nbsp; <kbd>5</kbd> coin &nbsp;
    <kbd>P</kbd> pause &nbsp; <kbd>R</kbd> record input script
  </div>
  <div class="row">
    <button id="rec-btn" disabled>Record</button>
    <span id="rec-status"></span>
    <a id="rec-dl" style="display:none; margin-left: 12px;" download="berzerk-input.jsonl">Download script</a>
  </div>
  <script type="module" src="./shell.js"></script>
</body>
</html>
